# BuildRail project state.
#
# This file reflects current, factual progress. It is not policy (see
# config.yml) and it is not aspirational — it must always describe reality.

schema_version: 1

project:
  name: BuildRail

current:
  lifecycle_state: FROZEN
  development_phase: BR2

authorization:
  id: BR2
  type: feature
  title: Governance Engine
  status: completed
  specification: .buildrail/specs/BR2-GOVERNANCE-ENGINE.md
  granted_by: human

candidate:
  branch: null
  base_sha: null
  candidate_sha: null

# Immutable approved checkpoints for completed/frozen phases. Distinct from
# `candidate` above, which tracks the exact in-progress candidate still
# moving through implementation/review — not a completed phase's record.
#
# `approved_sha` is the exact independently reviewed and Human-QA-approved
# implementation candidate, not the merge commit that later brought it into
# main. The merge commit for BR1 was 3b695399eae01720804ec496e7735d636edaed41
# — a separate repository checkpoint, recorded here for reference only.
baselines:
  BR0:
    approved_sha: 04c93767510c51916fcc51f60b85b674c7d6f1cc
    status: frozen
  BR1:
    approved_sha: 36f7b0a569eeee0cd1c5d7472cf176763c818a2e
    status: frozen
  BR2:
    approved_sha: 720abf34d80933714475ec56ab43fd39fa82f484
    status: frozen

# BR0, BR1, and BR2 have each been independently reviewed, approved, and
# frozen at the SHAs recorded under `baselines`. BR1 established the
# first real, executable BuildRail CLI (packages/cli). BR2 implemented
# the provider-neutral governance engine (@buildrail/core) — config/state
# loading, schema validation, authorization policy, and the lifecycle
# transition engine — wired into real `buildrail status` output. Git
# inspection and verification-report generation remain unimplemented
# until BR3/BR4.
